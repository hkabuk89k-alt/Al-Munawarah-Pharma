<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21150b"><title>لوحة تحكم نيو ستايل</title>
<style>
:root{--gold:#c99a43;--ink:#21150b}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(140deg,#fff9e9,#f3dfc7 55%,#fff8e9);color:var(--ink);padding:14px}.panel{max-width:720px;margin:10px auto;background:#fffaf0;border:2px solid var(--gold);border-radius:16px;padding:18px;box-shadow:0 15px 45px #0002}.header-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:15px}.header-bar h2{margin:0;color:#6b4512;font-size:20px}.store-link{text-decoration:none;background:#218b51;color:white;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:bold}.panel input,.panel select,.panel button{width:100%;padding:11px;margin:6px 0;border:1px solid #d8bd85;border-radius:8px;font:inherit}.panel button{background:#6b4512;color:white;font-weight:bold;cursor:pointer}.panel button:disabled{opacity:0.6;cursor:wait}.panel button.secondary{background:#8b7770}.panel button.danger{background:#a83232}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.adminitem{background:#f4e8d3;border-radius:9px;padding:9px;margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.adminitem img{width:48px;height:55px;object-fit:cover;border-radius:6px}.adminitem span{flex:1;font-size:13px;min-width:100px}.adminitem button{width:auto;margin:0;padding:7px}.section-title{border-bottom:1px solid #dfbd7b;padding-bottom:7px;margin-top:22px;color:#543512}.security-box{background:#f9efe0;border:1px dashed #c99a43;padding:12px;border-radius:10px;margin-top:22px}.preview-grid{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.preview-card{position:relative;width:72px;height:80px;border-radius:8px;overflow:hidden;border:1px solid #c99a43}.preview-card img{width:100%;height:100%;object-fit:cover}.preview-card button{position:absolute;top:2px;left:2px;width:22px;height:22px;padding:0;margin:0;background:#a83232;color:white;border:none;border-radius:50%;font-size:13px;line-height:1}
</style></head><body>
<div class="panel">
  <div class="header-bar">
    <h2>لوحة تحكم نيو ستايل</h2>
    <a class="store-link" href="/" target="_blank">معاينة المتجر ↗</a>
  </div>

  <div id="login">
    <p>أدخل كلمة المرور لإدارة المتجر:</p>
    <input type="password" id="pass" placeholder="كلمة المرور" onkeyup="if(event.key==='Enter')login()">
    <button id="loginBtn" onclick="login()">تسجيل الدخول</button>
  </div>

  <div id="editor" style="display:none">
    <h3 class="section-title">إدارة الأقسام</h3>
    <div class="row"><input id="newCategory" placeholder="اسم القسم الجديد"><button id="addCatBtn" onclick="addCategory()">إضافة قسم</button></div>
    <div id="categoryAdmin"></div>

    <h3 class="section-title" id="formtitle">إضافة منتج (حتى 5 صور)</h3>
    <input id="pname" placeholder="اسم المنتج">
    <input id="pprice" placeholder="السعر (مثال: 5000)">
    <select id="pcurrency" aria-label="عملة السعر">
      <option value="YER">ريال يمني</option>
      <option value="SAR">ريال سعودي</option>
    </select>
    <input id="pwa" placeholder="رقم واتساب" value="967773801095">
    <select id="pcategory"></select>
    <label>صور المنتج (يمكنك تحديد من 1 إلى 5 صور):</label>
    <input id="pimage" type="file" accept="image/*" multiple>
    <div class="preview-grid" id="previewGrid"></div>
    <div class="row"><button id="saveBtn" onclick="saveProduct()">حفظ المنتج</button><button class="secondary" onclick="resetForm()">إلغاء التعديل</button></div>

    <h3 class="section-title">المنتجات الحالية</h3>
    <div class="adminlist" id="adminlist"><p>جاري تحميل البيانات...</p></div>

    <div class="security-box">
      <h3 style="margin-top:0;color:#543512;font-size:16px">🔐 تغيير كلمة مرور لوحة التحكم</h3>
      <div class="row">
        <input type="password" id="newPassInput" placeholder="اكتب كلمة المرور الجديدة">
        <button id="changePassBtn" class="secondary" onclick="changePassword()">تحديث كلمة المرور</button>
      </div>
    </div>

    <button class="danger" style="margin-top:20px" onclick="logout()">تسجيل الخروج</button>
  </div>
</div>

<script>
const defaultCategories=['ملابس أطفال','قسم عطور','قسم مكياج','قسم شامبو','قسم الجمال'];
const kidsSeed=[
  {id:101,name:'فستان أطفال AK472',price:'السعر عند التواصل',image:'images/kids_AK472.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:102,name:'فستان أطفال SA6189',price:'السعر عند التواصل',image:'images/kids_SA6189.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:103,name:'فستان أطفال SA5975',price:'السعر عند التواصل',image:'images/kids_SA5975.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:104,name:'فستان أطفال SA6233',price:'السعر عند التواصل',image:'images/kids_SA6233.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:105,name:'فستان أطفال 82457',price:'السعر عند التواصل',image:'images/kids_82457.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:106,name:'فستان أطفال SA5981',price:'السعر عند التواصل',image:'images/kids_SA5981.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:107,name:'فستان أطفال SA6190',price:'السعر عند التواصل',image:'images/kids_SA6190.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:108,name:'فستان أطفال SA6245',price:'السعر عند التواصل',image:'images/kids_SA6245.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:109,name:'فستان أطفال AK465',price:'السعر عند التواصل',image:'images/kids_AK465.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'},
  {id:110,name:'فستان أطفال SA6241',price:'السعر عند التواصل',image:'images/kids_SA6241.jpg',wa:'967773801095',category:'ملابس أطفال',buttonText:'اطلبي عبر واتساب'}
];

let categories=[...defaultCategories];
let items=[...kidsSeed];
let editing=null,adminPass='';
// قائمة الصور الحالية في النموذج: كل عنصر {url?: string, base64?: string, filename?: string}
let draftImages=[];

function getProductImages(p){
  if(Array.isArray(p.images) && p.images.length) return p.images;
  return p.image ? [p.image] : [];
}

async function loadStoreData(){
  try{
    const res=await fetch('/api/store');
    const data=await res.json();
    if(data.categories && data.categories.length) categories=data.categories;
    if(data.items) items=data.items;
  }catch(e){
    console.error('فشل جلب البيانات:',e);
  }
  renderAdmin();
}

async function persist(){
  const res=await fetch('/api/store',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      password:adminPass,
      action:'saveData',
      payload:{categories,items}
    })
  });
  if(!res.ok) throw new Error('فشل الحفظ في السيرفر');
}

async function login(){
  const p=document.getElementById('pass').value;
  if(!p){alert('أدخل كلمة المرور');return}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='جاري التحقق...';
  try{
    const res=await fetch('/api/store',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:p,action:'verifyLogin'})
    });
    if(res.ok){
      adminPass=p;
      document.getElementById('login').style.display='none';
      document.getElementById('editor').style.display='block';
      loadStoreData();
    }else{
      alert('كلمة المرور غير صحيحة');
    }
  }catch(e){
    alert('تعذر الاتصال بالسيرفر');
  }finally{
    btn.disabled=false;btn.textContent='تسجيل الدخول';
  }
}

async function changePassword(){
  const newPass=document.getElementById('newPassInput').value.trim();
  if(newPass.length<4){alert('اكتب كلمة مرور جديدة من 4 أحرف أو أكثر');return}
  if(!confirm('هل أنت متأكد من حذف كلمة المرور السابقة واعتماد الجديدة؟'))return;

  const btn=document.getElementById('changePassBtn');
  btn.disabled=true;btn.textContent='جاري التحديث...';
  try{
    const res=await fetch('/api/store',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        password:adminPass,
        action:'changePassword',
        payload:{newPassword:newPass}
      })
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'فشل تغيير كلمة المرور');
    adminPass=newPass;
    document.getElementById('newPassInput').value='';
    alert('تم تغيير كلمة المرور بنجاح وحذف السابقة!');
  }catch(e){
    alert('خطأ: '+e.message);
  }finally{
    btn.disabled=false;btn.textContent='تحديث كلمة المرور';
  }
}

function logout(){
  adminPass='';
  document.getElementById('pass').value='';
  document.getElementById('editor').style.display='none';
  document.getElementById('login').style.display='block';
}

function compressFile(file){
  return new Promise(resolve=>{
    const filename=file.name.replace(/[^a-zA-Z0-9.]/g,'_')||'product.jpg';
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement('canvas'),max=1000,scale=Math.min(1,max/Math.max(im.width,im.height));
        c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        resolve({base64:c.toDataURL('image/jpeg',.82),filename});
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

document.getElementById('pimage').addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]);
  if(!files.length) return;
  const remaining=5-draftImages.length;
  if(remaining<=0){
    alert('الحد الأقصى 5 صور لكل منتج. احذف صورة أولاً لإضافة غيرها.');
    e.target.value='';
    return;
  }
  if(files.length>remaining){
    alert('يمكنك إضافة '+remaining+' صور إضافية فقط (الحد الأقصى 5 صور).');
  }
  const selected=files.slice(0,remaining);
  for(const f of selected){
    const compressed=await compressFile(f);
    draftImages.push(compressed);
  }
  e.target.value='';
  renderPreviews();
});

function renderPreviews(){
  const grid=document.getElementById('previewGrid');
  grid.innerHTML='';
  draftImages.forEach((item,idx)=>{
    const card=document.createElement('div');card.className='preview-card';
    const img=document.createElement('img');img.src=item.url||item.base64;
    const del=document.createElement('button');del.textContent='×';del.title='حذف الصورة';
    del.onclick=()=>{draftImages.splice(idx,1);renderPreviews()};
    card.append(img,del);grid.append(card);
  });
}

async function saveProduct(){
  let name=document.getElementById('pname').value.trim(),price=document.getElementById('pprice').value.trim(),currency=document.getElementById('pcurrency').value,wa=document.getElementById('pwa').value.trim()||'967773801095',category=document.getElementById('pcategory').value;
  if(!name){alert('اكتب اسم المنتج');return}
  if(!category){alert('أضف قسماً أولاً');return}
  if(!draftImages.length){alert('اختر صورة واحدة على الأقل للمنتج');return}

  const btn=document.getElementById('saveBtn');
  btn.disabled=true;

  try{
    const finalUrls=[];
    for(let i=0;i<draftImages.length;i++){
      const item=draftImages[i];
      if(item.url){
        finalUrls.push(item.url);
      }else if(item.base64){
        btn.textContent='جاري رفع الصورة '+(i+1)+' من '+draftImages.length+'...';
        const upRes=await fetch('/api/store',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            password:adminPass,
            action:'uploadImage',
            payload:{base64:item.base64,filename:item.filename}
          })
        });
        const upData=await upRes.json();
        if(!upRes.ok) throw new Error(upData.error||'فشل رفع الصورة');
        finalUrls.push(upData.url);
      }
    }

    btn.textContent='جاري حفظ البيانات...';
    if(editing!==null){
      let p=items.find(x=>x.id===editing);
      if(!p)return;
      p.name=name;p.price=price;p.currency=currency;p.wa=wa;p.category=category;
      p.image=finalUrls[0];
      p.images=finalUrls;
    }else{
      items.unshift({
        id:Date.now(),name,price,currency,wa,category,
        image:finalUrls[0],
        images:finalUrls,
        buttonText:'اطلبي عبر واتساب'
      });
    }

    await persist();
    resetForm();
    renderAdmin();
    alert('تم حفظ المنتج بجميع صوره بنجاح!');
  }catch(err){
    alert('حدث خطأ: '+err.message);
  }finally{
    btn.disabled=false;btn.textContent='حفظ المنتج';
  }
}

function resetForm(){
  editing=null;draftImages=[];renderPreviews();
  document.getElementById('pname').value='';
  document.getElementById('pprice').value='';
  document.getElementById('pcurrency').value='YER';
  document.getElementById('pwa').value='967773801095';
  document.getElementById('pimage').value='';
  document.getElementById('formtitle').textContent='إضافة منتج (حتى 5 صور)';
}

async function addCategory(){
  let name=document.getElementById('newCategory').value.trim();
  if(!name){alert('اكتب اسم القسم');return}
  if(categories.includes(name)){alert('القسم موجود مسبقاً');return}
  const btn=document.getElementById('addCatBtn');
  btn.disabled=true;btn.textContent='جاري الحفظ...';
  try{
    categories.push(name);
    document.getElementById('newCategory').value='';
    await persist();
    renderAdmin();
  }catch(err){
    categories.pop();
    alert('فشل إضافة القسم: '+err.message);
  }finally{
    btn.disabled=false;btn.textContent='إضافة قسم';
  }
}

async function deleteCategory(name){
  if(items.some(p=>p.category===name)){alert('لا يمكن حذف قسم يحتوي منتجات. احذف منتجات القسم أولاً.');return}
  if(!confirm('حذف القسم «'+name+'»؟'))return;
  const backup=[...categories];
  categories=categories.filter(c=>c!==name);
  try{
    await persist();
    renderAdmin();
  }catch(err){
    categories=backup;
    alert('فشل الحذف: '+err.message);
  }
}

function renderAdmin(){
  let sel=document.getElementById('pcategory');
  let chosen=sel.value;sel.innerHTML='';
  categories.forEach(cat=>{let o=document.createElement('option');o.value=cat;o.textContent=cat;sel.append(o)});
  if(categories.includes(chosen))sel.value=chosen;else if(categories.length)sel.value=categories[0];

  let cats=document.getElementById('categoryAdmin');cats.innerHTML='';
  categories.forEach(cat=>{let d=document.createElement('div');d.className='adminitem';let s=document.createElement('span');s.textContent=cat;let del=document.createElement('button');del.className='danger';del.textContent='حذف القسم';del.onclick=()=>deleteCategory(cat);d.append(s,del);cats.append(d)});

  let list=document.getElementById('adminlist');list.innerHTML='';
  items.forEach(p=>{
    const imgs=getProductImages(p);
    let d=document.createElement('div');d.className='adminitem';
    let im=document.createElement('img');im.src=imgs[0]||'';
    let s=document.createElement('span');
    s.textContent=p.name+' — '+(p.price||'السعر عند التواصل')+' ['+p.category+'] ('+imgs.length+' صور)';
    let edit=document.createElement('button');edit.textContent='تعديل';
    edit.onclick=()=>{
      editing=p.id;
      draftImages=imgs.map(u=>({url:u}));
      renderPreviews();
      document.getElementById('pname').value=p.name;
      document.getElementById('pprice').value=p.price||'';
      document.getElementById('pcurrency').value=p.currency||'YER';
      document.getElementById('pwa').value=p.wa||'967773801095';
      document.getElementById('pcategory').value=p.category;
      document.getElementById('formtitle').textContent='تعديل المنتج (يمكنك إضافة أو حذف صور حتى 5)';
      window.scrollTo({top:0,behavior:'smooth'});
    };
    let del=document.createElement('button');del.className='danger';del.textContent='حذف';
    del.onclick=async()=>{if(confirm('حذف المنتج؟')){const backup=[...items];items=items.filter(x=>x.id!==p.id);try{await persist();renderAdmin()}catch(e){items=backup;alert('فشل الحذف')}}};
    d.append(im,s,edit,del);list.append(d);
  });
}
</script></body></html>
